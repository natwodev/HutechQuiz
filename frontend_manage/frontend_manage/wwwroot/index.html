    <script>
        // chặn cache form input
        window.disableAutocomplete = () => {
            document.querySelectorAll("input").forEach(i => {
                i.setAttribute("autocomplete", "off");
            });
        };

        // Function to download file from base64
        window.downloadFile = (fileName, base64Content) => {
            try {
                const byteCharacters = atob(base64Content);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Error downloading file:', error);
            }
        };
    </script>
    <script>
        // Đã loại bỏ chức năng chặn chuột phải và DevTools

        // Fetch với credentials để gửi cookie
        window.fetchWithCredentials = async function (url, method, body) {
            try {
                const options = {
                    method: method,
                    credentials: 'include', // Quan trọng: gửi cookie
                    headers: {
                        'Content-Type': 'application/json',
                    },
                };

                if (body && method !== 'GET') {
                    options.body = body;
                }

                const response = await fetch(url, options);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                return await response.text();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        };

        // Giữ nguyên console để dễ debug lỗi
    </script>
