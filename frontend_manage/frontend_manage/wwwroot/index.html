    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="/jquery/jquery.min.js"></script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- Load thư viện canvas ảnh cho điểm thí sinh -->
    <script src="_content/Blazor.Extensions.Canvas/blazor.extensions.canvas.js"></script>
    <!-- Load thư viện Latex ngay ban đầu tránh tải lâu-->
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        console.log('MathJax is ready');
                    });
                }
            }
        };
    </script>
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/result-page.css" rel="stylesheet" />
    <link href="css/academic-affairs.css" rel="stylesheet" />
    <!--Tải MudBlazor-->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="Hutech.Exam.Client.styles.css" rel="stylesheet" /> -->

<body class="warm-filter">
    <div id="app">
        <div class="progress" style="height: 5px;">
            <div class="progress-bar" role="progressbar" style="width: var(--blazor-load-percentage, 0%); background-color: rgb(0,107,179)" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="vh-100 d-flex align-items-center justify-content-center gap-3" style="font-family: Segoe UI-Bold, Helvetica;">
            <div class="h5 spinner-border"></div>
            <div class="h2">Vui lòng chờ</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/mathJaxBlazor.js"></script>
    <script src="js/scroll.js"></script>
    <script src="js/lecturer.js"></script>
    <script>
        // chặn cache form input
        window.disableAutocomplete = () => {
            document.querySelectorAll("input").forEach(i => {
                i.setAttribute("autocomplete", "off");
            });
        };
    </script>
    <script>
        // Chặn chuột phải
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        // Chặn F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        document.addEventListener('keydown', function (e) {
            // Chặn F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }

            // Chặn Ctrl+Shift+I (Developer Tools)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }

            // Chặn Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }

            // Chặn Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }

            // Chặn Ctrl+Shift+C (Inspect Element)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
        });

        // Chặn DevTools bằng cách detect khi window resize
        let devtools = { open: false, orientation: null };
        setInterval(() => {
            const threshold = 160;
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;

            if (widthThreshold || heightThreshold) {
                if (!devtools.open) {
                    devtools.open = true;
                    devtools.orientation = widthThreshold ? 'vertical' : 'horizontal';
                }
                // Có thể thêm action khi detect devtools mở
                // window.location.reload();
            } else {
                devtools.open = false;
                devtools.orientation = null;
            }
        }, 500);

        // Fetch với credentials để gửi cookie
        window.fetchWithCredentials = async function (url, method, body) {
            try {
                const options = {
                    method: method,
                    credentials: 'include', // Quan trọng: gửi cookie
                    headers: {
                        'Content-Type': 'application/json',
                    },
                };

                if (body && method !== 'GET') {
                    options.body = body;
                }

                const response = await fetch(url, options);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                return await response.text();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        };

        // Chặn console.log
        console.log = function () { };
        console.info = function () { };
        console.warn = function () { };
        console.error = function () { };
        console.debug = function () { };
    </script>
</body>

</html>

<style>
    .warm-filter {
        filter: invert(0.03) hue-rotate(1deg);
    }
</style>
