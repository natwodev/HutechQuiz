<body class="warm-filter" style="margin: 0; padding: 0; overflow-x: hidden;">
    <div id="app" style="margin: 0; padding: 0;">
        <div class="progress" style="height: 5px; margin: 0;">
            <div class="progress-bar" role="progressbar" style="width: var(--blazor-load-percentage, 0%); background-color: rgb(0,107,179)" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="vh-100 d-flex align-items-center justify-content-center gap-3" style="font-family: Segoe UI-Bold, Helvetica;">
            <div class="h5 spinner-border"></div>
            <div class="h2">Vui lòng chờ</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/lecturer.js"></script>
    <script>
        // chặn cache form input
        window.disableAutocomplete = () => {
            document.querySelectorAll("input").forEach(i => {
                i.setAttribute("autocomplete", "off");
            });
        };
    </script>
    <script>
        // Chặn chuột phải
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // Chặn F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        document.addEventListener('keydown', function(e) {
            // Chặn F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+Shift+I (Developer Tools)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+Shift+C (Inspect Element)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
        });

        // Chặn DevTools bằng cách detect khi window resize
        let devtools = { open: false, orientation: null };
        setInterval(() => {
            const threshold = 160;
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            
            if (widthThreshold || heightThreshold) {
                if (!devtools.open) {
                    devtools.open = true;
                    devtools.orientation = widthThreshold ? 'vertical' : 'horizontal';
                }
                // Có thể thêm action khi detect devtools mở
                // window.location.reload();
            } else {
                devtools.open = false;
                devtools.orientation = null;
            }
        }, 500);

        // Fetch với credentials để gửi cookie
        window.fetchWithCredentials = async function(url, method, body) {
            try {
                // Get token from localStorage
                const token = localStorage.getItem('authToken');
                const authType = localStorage.getItem('authType');
                
                const options = {
                    method: method,
                    credentials: 'include', // Try with include to ensure cookies are sent
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                };
                
                // Add Authorization header with token if available
                if (token) {
                    options.headers['Authorization'] = `Bearer ${token}`;
                }
                
                if (body && method !== 'GET') {
                    options.body = body;
                }

                const response = await fetch(url, options);
                
                // Store original URL for debugging
                const originalUrl = url;
                
                // Only for debugging - override console.log is below
                const originalConsoleLog = console.log;
                originalConsoleLog(`[fetchWithCredentials] ${method} ${url} - Status: ${response.status}`);
                
                // DO NOT automatically redirect - return error object instead
                // This prevents redirect loops
                if (!response.ok) {
                    const errorText = await response.text();
                    originalConsoleLog(`[fetchWithCredentials] Error response: ${errorText}`);
                    
                    // Return error object instead of redirecting
                    if (response.status === 401) {
                        return JSON.stringify({
                            error: "Unauthorized",
                            status: 401,
                            message: "Authentication required"
                        });
                    }
                    
                    // For other errors, return error details
                    return JSON.stringify({
                        error: "HttpError",
                        status: response.status,
                        message: errorText
                    });
                }
                
                // Try to parse as JSON, return empty string if no content
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    const text = await response.text();
                    return text || '{}'; // Return empty JSON object if no content
                } else {
                    return '{}';
                }
            } catch (error) {
                // For debugging - override console.error is below
                const originalConsoleError = console.error;
                originalConsoleError('Fetch error:', error);
                
                return JSON.stringify({
                    error: "FetchError",
                    message: error.message
                });
            }
        };

        // Chặn console.log
        console.log = function() {};
        console.info = function() {};
        console.warn = function() {};
        console.error = function() {};
        console.debug = function() {};
    </script>
</body>

</html>
